# Common evaluation environment: reuse the launcher's four attacker prompt sets,
# existing defender prompts, ToM judge logic, fooling judge logic, and ToM-SB data.
# The adapter directory is the exact path produced by the SFT job.
DatasetConfig:
  dataset: "three_layered_dataset"
  train_end_p: 0.75
  eval_start_p: 0.75
RunConfig:
  eval_only: true
  do_run_first_eval: true
ModelConfig:
  engine: "omnitom_stage1_sft_qwen3_14b"
  checkpoints_dir: "/home/ad906660/omnitom_da_experiment/results/checkpoints"
  judge_model: "mistralai/Mistral-Large-Instruct-2407"
  attacker_model: "meta-llama/Llama-3.3-70B-Instruct"
  attacker_type: "verifying_attacker_swapable_prompt"
  defender_type: "integrated_defender_with_reflection_v2"
TrainingConfig:
  training_strategy: "TrajectorywiseGRPO"
  reward_functions: "backward_ToM_belief"
