DatasetConfig:
  dataset: "three_layered_dataset"
  train_end_p: 0.75
  eval_start_p: 0.75
RunConfig:
  eval_only: true
  do_run_first_eval: true
TrainingConfig:
  loss_type: "dr_grpo"
