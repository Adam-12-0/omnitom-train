# Open-weight reproduction config. Recipe values mirror train_traj_fool.yaml.
DatasetConfig:
  dataset: "three_layered_dataset"
  train_end_p: 0.75
  eval_start_p: 0.75
ModelConfig:
  engine: "Qwen3-14B"
  judge_model: "mistralai/Mistral-Large-Instruct-2407"
  attacker_model: "meta-llama/Llama-3.3-70B-Instruct"
  attacker_type: "verifying_attacker_swapable_prompt"
  defender_type: "integrated_defender_with_reflection_v2"
TrainingConfig:
  training_strategy: "TrajectorywiseGRPO"
  epochs: 1
  max_grad_norm: 1.0
  reward_functions: "fooling_successful"
  enable_lock_on_generate: true
  max_iterations: 15
  num_generations: 8
  max_completion_length: 20000
  loss_type: "dr_grpo"
  learning_rate: 1e-5
  gradient_accumulation_steps: 4
  lr_scheduler: "linear"
LoRAConfig:
  rank: 32
  target_modules: "all-linear"
  alpha: 32
  lr_warmup_ratio: 0.0
